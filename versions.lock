[copies.train]
path = 'C:\ssbot\game\train'
# D15: steam_api64.dll renamed to steam_api64.dll.disabled -> "No online subsystems packaged", saves go to the default folder
steam_detached = "rename steam_api64.dll"
loader = "BepInEx 5.4.23.4 win_x64"
loader_zip_sha256 = "f881201b79da03e513bf97cdf39607ffa7f9e0d31a519b1aeeca8eb60f8309e7"

[frozen_settings]
# 2026-09-29: the display (LG TV) tops out at 60 Hz, so 120 Hz is off the table.
fps = 60
display_mode = "1920x1080 windowed on the 4K desktop, game VSync on, DWM-composed"
refresh_hz = 60
language = "ZH"  # 2026-09-29: frozen to Chinese, the user's own setting
camera_shake = "Off"      # CameraShakeSetting = 2
particles = "Low"         # VidParticles = 0
native_achievement_popups = "Off"  # GameNativePopups = 0 (in-game popup overlay)
# Golden PlayerPrefs snapshot (HKCU\Software\Team Cherry\Hollow Knight Silksong), restored after every training session
golden_prefs = 'C:\ssbot\sandbox\prefs\golden.reg'
golden_prefs_sha256 = "fc41b9c5427b4e23ec60af1f16808a6b497507eded5704b90c9224b056ea0469"
# DebugMod panels hidden by default (DebugModData/Settings.json; F2 toggles)
input_backend = "Input System (default)"
key_bindings = "default keyboard"

[environment]
nvidia_driver = "617.14"   # updated 2026-09-30 (was 591.86); P8 latency was measured on 591.86
ffmpeg = "9.0.2 (Gyan full build, winget)"   # NVENC API 13.1 needs driver >= 610
bios = "ASUS TUF GAMING Z790-PLUS WIFI 1836, microcode 0x133"
presentmon = 'v2.6.0 console, C:\ssbot\tools\presentmon\PresentMon-2.6.0-x64.exe, sha256 b2a706bc6ad475749e3b7e3409263aa1e6906d45bdcf993f6dbc0f660188f1af, Authenticode Intel Corporation'   # frame time (M1: +0.5 ms / 1 h vs vanilla)
