[project]
name = "ssbot"
version = "0.0.1"
description = "Silksong Steel Soul + Speedrunner bot (brain process)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "msgpack>=1.2.3",
    "numpy>=2.1",
    "windows-capture>=2.0.1",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = ["pytest>=8", "pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssbot"]
