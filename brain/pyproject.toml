[project]
name = "ssbot"
version = "0.0.1"
description = "Silksong Steel Soul + Speedrunner bot (brain process)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "msgpack>=1.2.3",
    "msgspec>=0.22.0",
    "numba>=0.68.0",
    "numpy>=2.1",
    "opencv-python>=5.0.0.93",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "rerun-sdk>=0.38.1",
    "shapely>=2.1.2",
    "windows-capture>=2.0.1",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = ["pytest>=8", "pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssbot"]

[tool.pytest.ini_options]
# brain/tests (most packages) and brain/ssbot/tests (hero-cam-hud) both hold tests.
testpaths = ["tests", "ssbot/tests"]
