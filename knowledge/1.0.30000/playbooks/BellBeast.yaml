# Bell Beast (route S03, Bone_05, "Bone Beast" 150 HP): L3 playbook for the M2 planner (DESIGN §3.5.1, §3.5.7, §4.4).
# Read by ssbot.combat.tactics.playbook. Safety never comes from here: every candidate still has to pass the support
# check (S), the safety filter and the supervisor; these entries only say where to stand and what to prefer.
#
# Facts (behaviour table knowledge/1.0.30000/enemies/BellBeast.json, 266 fights, 2026-10-01; M2 plan):
# - Body, AtkBells and DropBells all deal 2 masks, none parryable (parry bits COUNTER only): no parry here.
# - Set L / Set R anchors x 75.03 / 95.72; a charge emerges there (Charge Emerge 0.73 s, Charge Antic 0.60 s) and runs
#   across the whole arena (Charge 0.88 s) to stop at the far side (Charge End 0.15-0.18 s, Dig In 0.40-0.43 s).
# - A leap rises from the anchor and lands 16-27.75 u towards the other side (Leap Land 1.07-1.10 s, Dig In after it).
# - A burst erupts anywhere in x 81.2-91.2 (independent of the hero), y up to 7.55 u above its anchor, and fires one
#   attack bell each way along the floor (circle r 1.274, ~12 u/s); P2 adds DropBell M2 from the roof.
# - The decision chain runs at the end of Submerged (1.00-1.02 s underground); the first attack is a charge from the
#   right; one rage pattern (roar at x 86.21, then 7.5 s of drop bells) at the first P1 decision with HP <= 75.
# - Hunter nail 5 HP per hit (30 hits), Silkspear 15 HP for 4 silk, Bind 9 silk (+3 masks, 1.34-1.37 s).
enemy: BellBeast
boss_type: Bone Beast
scene: Bone_05
arena:
  x: [70.0, 101.2]        # hero collider centre range (gate faces 69.208 / 102.002, hero half width 0.25)
  hero_y: 3.0544          # hero collider centre standing on the floor (box bottom 2.015 + 1.0394)
hit_damage: {nail: 5, silkspear: 15}

stance:
  # Underground with the next attack unknown: in the oracle view the decision is seen 1.0-1.2 s before any damage,
  # so stand where every branch can still be escaped: between both charge emergences (x' -6..4.8 from 75.03 / 95.72)
  # and outside both leap landing zones (91-102.8 from the left anchor, 67.9-79.7 from the right one).
  hidden_x: 85.4
  # Vision-equivalent view without the dust cues (stage C): the burst position is unseen until the eruption, which
  # nothing escapes within about 4 u of it (bx - 3.75 .. bx + 4.0), while a charge or leap that emerges near the hero
  # is unescapable too (from the left anchor up to x 80.5 / 82.5, from the right one from 90 / 88). Planner ticks 4
  # frames after the boss is first drawn, hero idle at x (ssbot.tools.reactability, 2026-10-02): the chance that the
  # attack chosen underground is one the hero cannot escape is lowest at x 83 (0.157 with the P1 burst share 0.262,
  # 0.248 with the P2 share 0.414) against 0.21 / 0.33 at 85.5.
  hidden_x_vision: 83.0
  # Engage from just outside the support: the planner's own S check decides; this only biases the end position.
  engage_reach_u: 1.6     # stand this far from the boss box: the side slash reaches 2.81 u forward of the hurtbox
                          # centre (crests.json, P17); the support check stops the hero at its edge anyway
  risk_horizon_s: [0.4, 2.0]

# Punish windows: Control states in which the boss is drawn, committed to a state of known length and in reach of a
# safe position. Observable phases (VISION_EQUIVALENT) carry the same names through ssbot.core.bosses.
punish:
  - {state: Charge End, phase: recover, note: "stopped at the far wall"}
  - {state: Dig In, phase: recover, note: "0.40-0.43 s, then underground"}
  - {state: Leap Land, phase: recover, note: "1.07-1.10 s on the floor 16-27.75 u from its anchor"}
  - {state: Rage Roar, phase: roar, note: "1.5 s roaring at x 86.21"}
  # The person's experience (2026-10-02): beside the boss during the bell throw, two hits, then dodge the bells. The
  # support agrees (margins 0.15 / 0.25 u, floor, anchor frame): the eruption covers x' -3.5..3.5 for 0.15 s, the body
  # x' -2.5..2.5 to 0.85 s; the thrown bells land at x' +-2.5..4.5 from 0.95 s and roll out; x' +-3.5..4.5 is free
  # from 0.2 to 0.85 s and the centre from 0.85 to 1.85 s. Planner ticks with Burst Out as a punish window find safe
  # attack plans from x' -4.5..-3.5 from 0.25 s into it (17-127 safe candidates) and a way out over or inside the
  # bells at 0.6 s. The first version waited 5.5 u beside the burst before the eruption (run 20261002_041819); the
  # prepare stance stays 10 u out, the punish starts once the boss is up.
  - {state: Burst Out, phase: burst, note: "0.9 s drawn after the eruption; bells land beside it at 0.95 s"}

# Pre-positioning before a punish window, in the attack's anchor frame (x' along the attack from its anchor; side
# "attack": the attack's own direction, "hero": the side the hero is on). Live runs 2026-10-02 (3 CLEARs, 225-239 s):
# 40 of 58 hits were dealt in Leap Land, mostly one per landing, the hero arriving from the arena middle late.
# The leap lands its body at x' 16.6-26.6 (root box) after sweeping x' 12.5-27 at the landing frame; the burst erupts
# x' -4.5..4.5 and throws an attack bell up from 2 u each side (it comes down beside the boss about 1.05 s later, then
# rolls out at about 11 u/s, bouncing up to 4.85 u: support/ent/BoneBeast AtkBell R/self). Waiting 5.5 u beside the
# burst to punish it (first version) put the hero where the falling bell's support met the eruption's: FORCED_RISK
# through Burst Out and a bell hit in 6 of 6 QUITs of run 20261002_041819. 10 u leaves room to jump the rolling bell;
# Burst Out became a punish window again on 2026-10-02 (see punish), and the burst stance moved to 4.5 u beside the
# burst point (the person: wait at its side, hit twice, dodge the bells): the eruption covers x' -3.5..3.5 for its
# first 0.15 s; planner ticks with the hero standing at x' -4.5 / -4.0 find 153-174 safe candidates 0.6 and 1.0 s
# before the eruption and 73-153 in its first 0.1 s (synthetic Bone_05, margins 0.15 / 0.25 u).
prepare:
  # A charge: wait 14 u in front of its anchor and jump it in place (hold 48 frames): 17 safe jump timings there
  # against the charge's support (margins 0.15 / 0.25 u, Bone_05 walls), landing 13.8 u out, next to where the
  # boss stops (root box from x' 16.8); jumping towards the charge lands behind it, 20 u from the punish window.
  - {state: Emerge Antic C, x_prime: 14.0, side: attack}
  - {state: Charge Emerge, x_prime: 14.0, side: attack}
  - {state: Charge Antic, x_prime: 14.0, side: attack}
  - {state: Charge, x_prime: 14.0, side: attack}
  - {state: Emerge Antic L, x_prime: 12.0, side: attack}
  - {state: Leap Out, x_prime: 12.0, side: attack}
  - {state: Descending, x_prime: 12.0, side: attack}
  - {state: Burst Antic, x_prime: 4.5, side: hero}
  - {state: Fire Bells, x_prime: 4.5, side: hero}
  - {state: Burst Out, x_prime: 4.5, side: hero}
  - {state: burst, x_prime: 4.5, side: hero}
  - {state: burst_tell, x_prime: 4.5, side: hero}     # the first burst-cue experiment (view degraded_tell)
  # the dust cues (PlannerPolicy view degraded_dust): dust at an anchor (charge or leap), low (charge), tall (leap),
  # in the burst range (burst)
  - {state: dust, x_prime: 13.0, side: attack}
  - {state: dust_low, x_prime: 14.0, side: attack}
  - {state: dust_tall, x_prime: 12.0, side: attack}
  - {state: dust_burst, x_prime: 4.5, side: hero}
  # vision-equivalent view: the observable phase stands for the state (a leap is seen only once it is in the air);
  # without the charge phases here the vision view met a charge from the hidden stance, 8 u in front of the left
  # anchor, and came down in it (run 20261002_061751, i0 ep0)
  - {state: leap, x_prime: 12.0, side: attack}
  - {state: emerge, x_prime: 14.0, side: attack}
  - {state: charge_antic, x_prime: 14.0, side: attack}
  - {state: charge, x_prime: 14.0, side: attack}

# Adaptive horizon (M2 plan): while a charge is committed, the planner rolls its dodges out to the end of the Charge
# (its longest logged dwells) plus 0.3 s, up to 2 s. With the 0.8 s horizon, jumps that cleared the charge's front
# half looked safe and landed on its back half (live run 20261002_045049: 5 hits, all charges). Observable phases map
# to their first state for the vision-equivalent view.
long_horizon:
  states: [Emerge Antic C, Charge Emerge, Charge Antic, Charge, emerge, charge_antic, charge, dust_low]
  until: Charge
  extra_s: 0.3
  map: {emerge: Charge Emerge, charge_antic: Charge Antic, charge: Charge, dust_low: Emerge Antic C}

# The boss's root box (its hurtbox) is disabled while it emerges and winds up a charge (live i2_002: Charge Emerge
# and Charge Antic every frame enabled False), so no hit can land there; scoring ignores those states.
no_hurtbox: [Charge Emerge, Charge Antic, emerge, charge_antic]

# Bind (HEAL) only where the support allows the whole Bind (DESIGN §3.5.6 commit test: T_min >= 1.37 + 0.15 s at the
# hero's position, silk >= 9, HP <= max - 3 or h <= 2, not PAUSE_PENDING); these are the states where it usually holds
# away from the boss. The live test decides every time.
bind:
  states: [Submerged, Dig In, Leap Land, Charge End, Rage Submerge, Rage Rumble]
  hp_missing_min: 2       # bind at 3/5 (h = 2) and below; the supervisor's own test asks HP <= max - 3 or h <= 2

weights:
  hit: 10.0               # per predicted nail hit on the boss (Silkspear: x 3)
  stance: 0.6             # per u from the stance at the end of the horizon
  risk: 3.0               # per unit of the end position's future support coverage
  waste: 0.6              # per attack press that hits nothing
  cast_waste: 2.0         # per Silkspear cast that hits nothing (4 silk of the Bind's 9), on top of waste
  face: 0.3               # facing the boss at the end
  ground: 0.2             # on the floor at the end
  cont: 0.15              # keeping the previous plan (hysteresis)
  jump: 0.15              # per jump press (no needless hopping)
# Dangerous cell (effect_miner on the data-policy run 20261001_122249, 263 fights): a side slash that meets an attack
# bell in Launch (still beside the boss, rising at 28-38 u/s) got the hero hit in 44 % (AtkBell L, n 16) and 64 %
# (AtkBell R, n 11) of contacts within 12 frames, against 6 % in matched no-contact frames. Attack bells take no path
# change from a hit (no tink states in their FSM); only the down spike pays off on them (bounce, 0.5 s bell cooldown).
